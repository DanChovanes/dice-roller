version: 2
project_name: whim

builds:
  - main: ./cmd/whim
    env: [CGO_ENABLED=0]
    goos: [linux, windows, darwin, freebsd]
    goarch: [amd64, arm64, arm]
    ignore:
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm
    goarm: ["7"]                     # 32-bit ARM (e.g. older Raspberry Pis)
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'