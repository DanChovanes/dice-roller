version: 2

builds:
  - # main: ./cmd/myapp              # uncomment if main package isn't in the repo root
    env: [CGO_ENABLED=0]
    goos: [linux, windows, darwin, freebsd]
    goarch: [amd64, arm64, arm]
    goarm: ["7"]                     # 32-bit ARM (e.g. older Raspberry Pis)
    flags: [-trimpath]
    # Overriding ldflags replaces GoReleaser's defaults, so the version
    # variables are re-added here. Declare them in package main:
    #   var version, commit, date string
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'